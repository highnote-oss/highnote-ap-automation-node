name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API — typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci
        working-directory: api

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: api

      - name: Build
        run: npm run build
        working-directory: api

      - name: Test
        run: npm test
        working-directory: api
        env:
          # services/highnote.ts validates these env vars at module load (it's
          # the boot-time gate for misconfigured deployments). All test files
          # mock the Highnote SDK or the service itself, so the values are
          # never used in an actual API call -- they just need to be present
          # so the module import doesn't throw.
          HIGHNOTE_API_KEY: test
          HIGHNOTE_CARD_PRODUCT_ID: test
          HIGHNOTE_APPLICATION_ID: test
          JWT_SECRET: test-jwt-secret-please-replace-in-production

  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
